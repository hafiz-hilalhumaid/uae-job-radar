# Every board here is checked every hour. Most coverage comes from data/uae_boards.json,
# which the weekly harvest + daily sweep fill automatically with every board that has UAE jobs.
# Put companies here that you always want watched, even when they have no UAE opening today.
# Identifiers marked "likely" were not seen in a live URL; the digest reports any that fail.
# Add more with:  python radar.py discover candidates.txt
# Pause one:      add  enabled: false
#
# Fields: ats = greenhouse | lever | ashby | smartrecruiters | workable | recruitee | teamtailor | workday
#   greenhouse: host: eu for boards on job-boards.eu.greenhouse.io (US host is tried as fallback)
