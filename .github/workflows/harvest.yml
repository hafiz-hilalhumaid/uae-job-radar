name: harvest

on:
  schedule:
    # Monthly (3rd of the month, 02:23 IST). Common Crawl publishes new crawls roughly monthly.
    - cron: "53 20 2 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-harvest      # only writes data/tokens.json, so it can run alongside the others
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect job-board IDs from Common Crawl
        run: python radar.py harvest --crawls 2
      - name: Save board list
        run: |
          git config user.name "uae-job-radar"
          git config user.email "uae-job-radar@users.noreply.github.com"
          git add data/tokens.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "radar: harvest"
          git pull --rebase --autostash
          git push
