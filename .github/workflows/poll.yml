name: poll

on:
  schedule:
    # Every hour at :17 (GitHub delays jobs scheduled on the hour).
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-state        # shared with digest/sweep so only one of them writes data/ at a time
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check all watched boards
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}       # optional (Fantastic.jobs)
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}     # optional (JSearch / Google for Jobs)
        run: python radar.py poll
      - name: Save state
        run: |
          git config user.name "uae-job-radar"
          git config user.email "uae-job-radar@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "radar: update"
          git pull --rebase --autostash
          git push
