name: sweep

on:
  schedule:
    # Daily at 04:17 IST (22:47 UTC). Minute 47 keeps clear of the hourly poll at :17.
    # PRIVATE repo? Use "47 22 * * 2,6" (twice a week) to stay inside the free Actions minutes.
    - cron: "47 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-state
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Find harvested boards that have UAE jobs
        run: python radar.py sweep --max-minutes 40
      - name: Save state
        run: |
          git config user.name "uae-job-radar"
          git config user.email "uae-job-radar@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "radar: sweep"
          git pull --rebase --autostash
          git push
