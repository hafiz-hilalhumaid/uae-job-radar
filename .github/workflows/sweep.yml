name: sweep

on:
  # Started daily ~04:00 IST by apps_script/Scheduler.gs. No GitHub cron here: GitHub fires it hours
  # late, and a 40-minute sweep running at 8am made the Mon/Wed/Fri digest wait and get cancelled.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-state
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main          # latest state, even if this run waited behind another one
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Find harvested boards that have UAE jobs
        run: python radar.py sweep --max-minutes 40
      - name: Save state
        run: |
          git config user.name "uae-job-radar"
          git config user.email "uae-job-radar@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "radar: sweep"
          git pull --rebase --autostash
          git push
