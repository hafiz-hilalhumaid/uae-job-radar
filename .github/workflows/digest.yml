name: digest

on:
  schedule:
    # 08:03 IST on Mon, Wed, Fri (02:33 UTC). Edit to taste.
    - cron: "33 2 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-state
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python radar.py digest
      - name: Save state
        run: |
          git config user.name "uae-job-radar"
          git config user.email "uae-job-radar@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "radar: digest sent"
          git pull --rebase --autostash
          git push
